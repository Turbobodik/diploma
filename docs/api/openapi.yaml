          type: integer
          title: Char Start
          description: Start character offset in extracted_text
          examples:
            - 1204
        char_end:
          type: integer
          title: Char End
          description: Exclusive end character offset
          examples:
            - 1480
        passage_text:
          type: string
          title: Passage Text
          description: Verbatim excerpt from the source document
        model_name:
          type: string
          title: Model Name
          description: NLI model identifier
          examples:
            - cross-encoder/nli-deberta-v3-xsmall
        model_label:
          type: string
          enum:
            - entailment
            - contradiction
            - neutral
          title: Model Label
          description: Original model prediction
          examples:
            - contradiction
        model_score:
          type: number
          title: Model Score
          description: Calibrated confidence score in [0, 1]
