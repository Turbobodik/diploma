                - contradiction
                - neutral
            - type: 'null'
          title: User Label
          description: Optional researcher override (US-09)
        effective_label:
          type: string
          enum:
            - entailment
            - contradiction
            - neutral
          title: Effective Label
          description: user_label if set, otherwise model_label
          examples:
