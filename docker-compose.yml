services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-factmap}
    ports:
      - "5433:5432"
    volumes:
      - factmap_pg_data:/var/lib/postgresql/data
      - ./backend/ddl/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factmap} -d ${POSTGRES_DB:-factmap}"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-factmap}:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/${POSTGRES_DB:-factmap}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars-local-compose}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173}
      ML_BACKEND: ${ML_BACKEND:-stub}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - factmap_uploads:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  factmap_pg_data:
  factmap_uploads:
