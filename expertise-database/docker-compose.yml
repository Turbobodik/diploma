services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: factmap
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: factmap
    ports:
      - "5433:5432"
    volumes:
      - factmap_pg:/var/lib/postgresql/data
      - ./ddl/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factmap -d factmap"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  factmap_pg:
