name: FactMap Scholar CI

on:
  push:
    branches: [main, wip/remote-agent-context]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Back-End (Ruff, Pytest + Coverage, pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Lint with Ruff
        run: ruff check app tests scripts
      - name: Run unit & API integration tests with coverage gate
        env:
          ML_BACKEND: stub
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80 -v
      - name: Audit Python dependencies
        run: pip-audit

  api-docs:
    name: API Documentation (Redocly OpenAPI 3.1 Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint OpenAPI 3.1 specification
        run: npx -y @redocly/cli@latest lint docs/api/openapi.yaml

  frontend:
    name: Front-End & Adaptive UI (Lint, Build, Vitest, Playwright E2E)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting & ESLint
        run: |
          npm run format:check
          npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Run Vitest unit tests
        run: npm run test
      - name: Install Playwright Chromium & run E2E + Adaptive UI suites
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  docker:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Docker image (lightweight cloud target)
        run: docker build --build-arg INSTALL_ML=false -t factmap-backend:ci ./backend
      - name: Build Frontend Docker image
        run: docker build -t factmap-frontend:ci ./frontend
