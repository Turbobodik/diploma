          type: string
          title: Passage Id
          description: Source passage UUID
        document_id:
          type: string
          title: Document Id
          description: Document UUID containing the passage
        document_name:
          type: string
          title: Document Name
          description: Filename of the evidence document
          examples:
            - scinli_2022.pdf
        page_no:
          anyOf:
            - type: integer
            - type: 'null'
          title: Page No
          description: 1-based page number for PDFs
          examples:
            - 4
