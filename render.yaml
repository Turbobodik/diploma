databases:
  - name: factmap-scholar-db
    plan: free
    databaseName: factmap
    user: factmap

services:
  - type: web
    name: factmap-scholar-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: factmap-scholar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ML_BACKEND
        value: stub
      - key: CORS_ORIGINS
        value: https://factmap-scholar-web.onrender.com,http://localhost:5173
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: factmap-scholar-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://factmap-scholar-api.onrender.com
