openapi: 3.1.0
info:
  title: FactMap Scholar API
  summary: Automatic scientific claim extraction and NLI-based evidence verification service.
  description: FactMap Scholar extracts atomic claims with exact character spans from uploaded scientific PDF/TXT publications, retrieves candidate evidence passages using dense embeddings, classifies claim–passage pairs via 3-way Natural Language Inference (`entailment`, `contradiction`, `neutral`), and exposes a queryable evidence graph.
  contact:
    name: Bahdan Kanoplich
    email: 20230498@student.ehu.lt
  license:
    name: MIT License
    identifier: MIT
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000
    description: Local development server
  - url: https://{host}
    description: Deployed cloud host
    variables:
      host:
        default: api.factmap-scholar.org
        description: API hostname
tags:
  - name: system
    description: Service health check and Prometheus observability metrics.
  - name: auth
    description: Researcher registration, Argon2id + RFC 7519 JWT authentication, and profile.
  - name: projects
    description: Project workspace lifecycle and GDPR cascading erasure (US-01, US-11).
  - name: documents
    description: Scientific PDF/TXT upload, SHA-256 deduplication, and text extraction (US-02).
  - name: analysis
    description: Asynchronous ML pipeline trigger and per-stage progress polling (US-03, US-04).
  - name: claims & graph
    description: Extracted claims, NLI evidence map, human label overrides, and JSON/CSV export (US-05, US-08, US-09).
paths:
  /health:
    get:
      tags:
        - system
      summary: Service health and active ML configuration
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security: []
  /metrics:
    get:
      tags:
        - system
      summary: Prometheus instrumentation metrics
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Prometheus text exposition format metrics
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP factmap_http_requests_total Total HTTP requests
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security: []
  /api/v1/auth/register:
    post:
      tags:
        - auth
      summary: Register a researcher account
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthOut'
        '409':
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Invalid email or password shorter than 8 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security: []
  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: Authenticate with email and password
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthOut'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/auth/me:
    get:
      tags:
        - auth
      summary: Return the currently authenticated user profile
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          description: Missing or expired Bearer JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security:
        - HTTPBearer: []
  /api/v1/projects:
    get:
      tags:
        - projects
      summary: List projects owned by the authenticated user
      operationId: list_projects_api_v1_projects_get
      security:
        - HTTPBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 200
            minimum: 1
            default: 50
            title: Limit
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
            title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
        - projects
      summary: Create a new analysis project workspace
      operationId: create_project_api_v1_projects_post
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: Duplicate project name for this owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Empty or invalid project name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /api/v1/projects/{project_id}:
    delete:
      tags:
        - projects
      summary: Delete a project and cascade all documents, claims, evidence, and stored files (GDPR US-11)
      operationId: delete_project_api_v1_projects__project_id__delete
      security:
        - HTTPBearer: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Project not found or owned by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/documents:
    get:
      tags:
        - documents
      summary: List documents and extraction statuses in a project
      operationId: list_documents_api_v1_projects__project_id__documents_get
      security:
        - HTTPBearer: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 200
            minimum: 1
            default: 50
            title: Limit
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
            title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
        - documents
      summary: Upload a scientific PDF or plain text file (<= 20 MB) and extract text
      operationId: upload_document_api_v1_projects__project_id__documents_post
      security:
        - HTTPBearer: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_document_api_v1_projects__project_id__documents_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: Identical file (SHA-256) already exists in project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: File empty or exceeds 20 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '415':
          description: Unsupported MIME type (only application/pdf and text/plain)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Text extraction failed or produced empty text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '429':
          description: Rate limit exceeded (60 req/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /api/v1/projects/{project_id}/analyze:
    post:
      tags:
        - analysis
      summary: Trigger asynchronous claim extraction, dense retrieval, and NLI verification
      operationId: start_analysis_api_v1_projects__project_id__analyze_post
      security:
        - HTTPBearer: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
        - name: sync
          in: query
          required: false
          schema:
            type: boolean
            description: Execute synchronously instead of in background worker (intended for smoke tests/CLI).
            default: false
            title: Sync
          description: Execute synchronously instead of in background worker (intended for smoke tests/CLI).
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeStartedOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: No ready documents, extraction still in progress, or analysis already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Rate limit exceeded (60 req/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /api/v1/projects/{project_id}/jobs:
    get:
      tags:
        - analysis
      summary: Poll recent pipeline jobs and progress percentages for a project
      operationId: list_jobs_api_v1_projects__project_id__jobs_get
      security:
        - HTTPBearer: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/claims:
    get:
      tags:
        - claims & graph
      summary: List extracted claims with NLI evidence, filters, search, and pagination
      operationId: list_claims_api_v1_projects__project_id__claims_get
      security:
        - HTTPBearer: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
        - name: label
          in: query
          required: false
          schema:
            anyOf:
              - enum:
                  - entailment
                  - contradiction
                  - neutral
                type: string
              - type: 'null'
            description: Filter by effective NLI label
            title: Label
          description: Filter by effective NLI label
        - name: document_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            description: Filter claims/evidence involving a specific document
            title: Document Id
          description: Filter claims/evidence involving a specific document
        - name: search
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Case-insensitive substring search across claim text and document title
            title: Search
          description: Case-insensitive substring search across claim text and document title
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 200
            minimum: 1
            default: 50
            title: Limit
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
            title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimsResponseOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/graph:
    get:
      tags:
        - claims & graph
      summary: Retrieve the interactive evidence map (document, claim, and passage nodes + NLI edges)
      operationId: get_evidence_graph_api_v1_projects__project_id__graph_get
      security:
        - HTTPBearer: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
        - name: label
          in: query
          required: false
          schema:
            anyOf:
              - enum:
                  - entailment
                  - contradiction
                  - neutral
                type: string
              - type: 'null'
            title: Label
        - name: document_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Document Id
        - name: include_neutral
          in: query
          required: false
          schema:
            type: boolean
            description: Include neutral NLI edges in the graph
            default: true
            title: Include Neutral
          description: Include neutral NLI edges in the graph
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/export:
    get:
      tags:
        - claims & graph
      summary: Export filtered claims and evidence edges as JSON or CSV (US-08)
      operationId: export_project_api_v1_projects__project_id__export_get
      security:
        - HTTPBearer: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Project Id
        - name: format
          in: query
          required: false
          schema:
            type: string
            pattern: ^(json|csv)$
            description: 'Export format: json or csv'
            default: json
            title: Format
          description: 'Export format: json or csv'
        - name: label
          in: query
          required: false
          schema:
            anyOf:
              - enum:
                  - entailment
                  - contradiction
                  - neutral
                type: string
              - type: 'null'
            title: Label
        - name: document_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/evidence/{evidence_id}:
    patch:
      tags:
        - claims & graph
      summary: Override an NLI edge label while preserving the original model prediction (US-09)
      operationId: override_label_api_v1_evidence__evidence_id__patch
      security:
        - HTTPBearer: []
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Evidence Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverrideOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Evidence edge not found or owned by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Invalid label value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
components:
  schemas:
    AnalyzeStartedOut:
      properties:
        status:
          type: string
          title: Status
          description: Initial execution status (queued or succeeded when sync=true)
          examples:
            - queued
        project_id:
          type: string
          title: Project Id
          description: Target project UUID
        job_ids:
          items:
            type: string
          type: array
          title: Job Ids
          description: Ordered UUIDs for extract_claims, retrieve, and nli jobs
      type: object
      required:
        - status
        - project_id
        - job_ids
      title: AnalyzeStartedOut
    AuthOut:
      properties:
        token:
          type: string
          title: Token
          description: RFC 7519 Bearer JWT access token
          examples:
            - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          title: Token Type
          description: Token scheme
          default: bearer
          examples:
            - bearer
        expires_in:
          type: integer
          title: Expires In
          description: Token lifetime in seconds
          examples:
            - 86400
        user:
          $ref: '#/components/schemas/UserOut'
      type: object
      required:
        - token
        - expires_in
        - user
      title: AuthOut
    Body_upload_document_api_v1_projects__project_id__documents_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: PDF or TXT file (max 20 MB)
      type: object
      required:
        - file
      title: Body_upload_document_api_v1_projects__project_id__documents_post
    ClaimOut:
      properties:
        id:
          type: string
          title: Id
          description: Claim UUID
        source_document_id:
          type: string
          title: Source Document Id
          description: Document UUID from which the claim was extracted
        source_name:
          type: string
          title: Source Name
          description: Filename of the source document
          examples:
            - scifact_2020.pdf
        page_no:
          anyOf:
            - type: integer
            - type: 'null'
          title: Page No
          description: 1-based PDF page number
          examples:
            - 2
        char_start:
          type: integer
          title: Char Start
          description: Start offset of exact claim slice
          examples:
            - 412
        char_end:
          type: integer
          title: Char End
          description: Exclusive end offset of exact claim slice
          examples:
            - 538
        text:
          type: string
          title: Text
          description: Verbatim extracted claim sentence
        confidence:
          type: number
          title: Confidence
          description: Claim-worthiness confidence in [0, 1]
          examples:
            - 0.845
        extractor_name:
          type: string
          title: Extractor Name
          description: Claim extractor identifier
          examples:
            - local-hybrid-claim-v1:BAAI/bge-small-en-v1.5
        has_evidence:
          type: boolean
          title: Has Evidence
          description: True if at least one non-neutral evidence edge exists; False triggers explicit empty-evidence state (US-04b)
        evidence:
          items:
            $ref: '#/components/schemas/EvidenceOut'
          type: array
          title: Evidence
      type: object
      required:
        - id
        - source_document_id
        - source_name
        - char_start
        - char_end
        - text
        - confidence
        - extractor_name
        - has_evidence
        - evidence
      title: ClaimOut
    ClaimsResponseOut:
      properties:
        claims:
          items:
            $ref: '#/components/schemas/ClaimOut'
          type: array
          title: Claims
        total:
          type: integer
          title: Total
          description: Total claims matching the active filters
          examples:
            - 12
        limit:
          type: integer
          title: Limit
          description: Page size applied
          examples:
            - 50
        offset:
          type: integer
          title: Offset
          description: Pagination offset applied
          examples:
            - 0
        jobs:
          items:
            $ref: '#/components/schemas/JobOut'
          type: array
          title: Jobs
      type: object
      required:
        - claims
        - total
        - limit
        - offset
        - jobs
      title: ClaimsResponseOut
    DeleteOut:
      properties:
        deleted:
          type: string
          title: Deleted
          description: UUID of the deleted project
          examples:
            - a3fc0bc4-b7be-46b2-abf3-273bf7c2737a
      type: object
      required:
        - deleted
      title: DeleteOut
    DocumentListOut:
      properties:
        documents:
          items:
            $ref: '#/components/schemas/DocumentOut'
          type: array
          title: Documents
        total:
          type: integer
          title: Total
          description: Total documents in project
          examples:
            - 4
        limit:
          type: integer
          title: Limit
          description: Page size applied
          examples:
            - 50
        offset:
          type: integer
          title: Offset
          description: Pagination offset applied
          examples:
            - 0
      type: object
      required:
        - documents
        - total
        - limit
        - offset
      title: DocumentListOut
    DocumentOut:
      properties:
        id:
          type: string
          title: Id
          description: Document UUID
          examples:
